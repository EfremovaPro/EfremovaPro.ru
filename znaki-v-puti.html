<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5fbf">
<title>Знаки в пути — игра по ПДД</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
:root{--bg:#eef4ff;--card:#fff;--ink:#16213a;--muted:#5d6a85;--blue:#1d5fbf;--red:#d71920;--yel:#f6c400;--grn:#16a35a;--line:#d8e2f3;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(29,95,191,.25)}
header .wrap{display:flex;align-items:center;gap:10px;padding:12px 14px}
.back{background:rgba(255,255,255,.18);width:42px;height:42px;border-radius:14px;font-size:22px;display:none;color:#fff}
.back.on{display:block}
.ttl{flex:1;font-weight:900;font-size:20px;line-height:1.1}
.ttl small{display:block;font-weight:700;font-size:12px;opacity:.85}
.pts{background:var(--yel);color:#3a2b00;border-radius:14px;padding:6px 10px;font-weight:900;font-size:15px;white-space:nowrap}
.snd{background:rgba(255,255,255,.18);width:42px;height:42px;border-radius:14px;font-size:20px;color:#fff}
main{padding-top:14px}
.rank{background:var(--card);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 0 var(--line)}
.rank .em{font-size:40px}
.rank b{font-size:18px;font-weight:900}
.bar{height:12px;background:#e6ecf7;border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),#5bd48f);border-radius:8px;transition:width .5s}
.muted{color:var(--muted);font-size:13px}
.modes{display:grid;gap:12px;margin-top:14px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode .ic{width:64px;height:64px;flex:none}
.mode b{font-size:19px;font-weight:900;display:block}
.mode span{font-size:14px;color:var(--muted)}
.note{margin:16px 0;padding:12px 14px;border-radius:16px;background:#fff7d6;color:#5b4700;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff}
.search{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px;background:#fff;margin-bottom:8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 8px}
.ghead b{font-size:17px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.sg{position:relative;background:var(--card);border-radius:16px;padding:8px 6px 6px;text-align:center;box-shadow:0 3px 0 var(--line)}
.sg svg{width:72px;height:72px;display:block;margin:0 auto}
.sg .nm{font-size:11px;line-height:1.15;margin-top:4px;color:var(--muted);height:3.45em;overflow:hidden}
.sg.got{background:#e7f8ee;box-shadow:0 3px 0 #b6e6c9}
.sg.got::after{content:"✓";position:absolute;top:4px;right:6px;background:var(--grn);color:#fff;width:22px;height:22px;border-radius:50%;font-size:14px;line-height:22px;font-weight:900}
.sg .star{position:absolute;top:4px;left:6px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .big{width:170px;height:170px;display:block;margin:0 auto 8px}
.sheet .num{display:inline-block;background:#eef2fa;border-radius:10px;padding:3px 10px;font-weight:900;font-size:14px;color:var(--blue)}
.sheet h2{margin:8px 0 6px;font-size:22px;line-height:1.2;font-weight:900}
.sheet p{font-size:17px;line-height:1.45;margin:8px 0 14px}
.btn{display:block;width:100%;padding:15px;border-radius:18px;font-size:18px;font-weight:900;background:var(--grn);color:#fff;box-shadow:0 4px 0 #0e7a42;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0e7a42}
.btn.sec{background:#eef2fa;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #134a99}
.btn:disabled{opacity:.6}
.row{display:flex;gap:10px}.row .btn{flex:1}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.bc{background:#fff;border-radius:18px;padding:10px 6px;box-shadow:0 4px 0 var(--line);position:relative;text-align:center}
.bc svg{width:78%;aspect-ratio:1;height:auto;display:block;margin:0 auto}
.bc .nm{font-size:11px;color:var(--muted);line-height:1.15;height:2.3em;overflow:hidden;margin-top:3px}
.bc.on{background:#fff4c2;box-shadow:0 4px 0 #f0d36a}
.bc.on::after{content:"";position:absolute;inset:8px;border:5px solid var(--red);border-radius:50%;opacity:.85}
.bc.win{background:#d6f5e3;box-shadow:0 4px 0 #9fdcb9}
.qcard{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 4px 0 var(--line);margin-top:6px}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:800}
.qtext{font-size:20px;font-weight:900;line-height:1.25;margin:10px 0}
.qsign{width:150px;height:150px;display:block;margin:4px auto 6px}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{background:#f2f6fd;border-radius:16px;padding:14px;text-align:left;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:center}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;font-weight:900;color:var(--blue)}
.opt.ok{background:#d6f5e3;box-shadow:0 3px 0 #8fd6ad}
.opt.bad{background:#ffe0e0;box-shadow:0 3px 0 #f0a5a5}
.opts.signs{grid-template-columns:1fr 1fr}
.opts.signs .opt{flex-direction:column;justify-content:center;padding:10px}
.opts.signs .opt svg{width:100px;height:100px}
.expl{margin-top:12px;padding:12px 14px;border-radius:16px;font-size:16px;line-height:1.4}
.expl.ok{background:#e7f8ee}.expl.bad{background:#fff1f1}
.lvl{display:flex;gap:8px;margin:6px 0 2px}
.lvl button{flex:1;background:#fff;border-radius:14px;padding:10px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.lvl button.on{background:var(--ink);color:#fff}
.center{text-align:center}
.huge{font-size:64px;margin:10px 0}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:16px;font-weight:900;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.conf{position:fixed;top:-40px;font-size:28px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:#fff;border-radius:18px;padding:12px;text-align:left;box-shadow:0 3px 0 var(--line)}
.gcard b{display:block;font-size:15px;font-weight:900;line-height:1.15}
.gcard .muted{font-size:12px}
.gcard .bar{height:8px}
.hide{display:none!important}
#drive{position:fixed;left:0;right:0;bottom:0;top:66px;z-index:6;background:#7fbf5a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#dcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#dflash{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .25s}
.dtop{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.dleft{display:flex;flex-direction:column;gap:6px;align-items:center}
.dspd{width:64px;height:64px;border-radius:50%;background:rgba(15,25,45,.85);color:#fff;font-weight:900;font-size:24px;display:grid;place-items:center;line-height:1;text-align:center;padding-top:6px;border:3px solid #fff}
.dspd small{display:block;font-size:10px;font-weight:700;opacity:.8}
.dlim{width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid #d71920;font-weight:900;font-size:18px;display:grid;place-items:center;color:#111}
.dlim.warn{animation:blink .5s infinite}
@keyframes blink{50%{transform:scale(1.18);background:#ffd6d6}}
.dinst{flex:1;background:rgba(255,255,255,.95);border-radius:16px;padding:8px 10px;font-size:14px;line-height:1.2;display:flex;gap:8px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.2);min-height:52px}
.dinst .ar{font-size:30px}.dinst small{color:var(--muted);font-size:11px}.dinst .mi{width:44px;height:44px;flex:none}
.dright{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.dheart{font-size:13px;background:rgba(255,255,255,.9);border-radius:10px;padding:2px 6px;white-space:nowrap}
.dpts{font-size:13px;font-weight:900;background:var(--yel);border-radius:10px;padding:2px 8px}
#dmm{width:84px;height:84px;border-radius:12px;border:2px solid #fff}
.dsign{position:absolute;left:8px;top:150px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.96);border-radius:16px;padding:6px 10px 6px 6px;max-width:72%;box-shadow:0 0 0 3px #ffeb3b,0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.dsign svg{width:58px;height:58px;flex:none}.dsign b{display:block;font-size:14px;line-height:1.15}.dsign span{font-size:12px;color:var(--muted)}
.dwarn{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;background:#16213a;color:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:15px;white-space:nowrap;pointer-events:none}
.dctl{position:absolute;left:0;right:0;bottom:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between;align-items:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.turns{display:flex;gap:6px}
.tb{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.92);font-size:26px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tb.on{background:#ff9800;color:#fff}.tb.na{opacity:.35}
.peds{display:flex;gap:8px}
.pb{width:78px;height:96px;border-radius:18px;font-weight:900;font-size:15px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.pb.br{background:#d71920;height:72px}.pb.gs{background:#16a35a}
.pb.dn{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3);filter:brightness(1.15)}
.mode.new{box-shadow:0 0 0 3px var(--yel),0 4px 0 var(--line)}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:8px;font-size:11px;padding:2px 6px;margin-left:6px;vertical-align:middle}

</style>
</head>
<body>
<header><div class="wrap">
  <button class="back" id="back" aria-label="Назад">‹</button>
  <div class="ttl" id="ttl">Знаки в пути<small>игра по ПДД для поездок</small></div>
  <div class="pts" id="pts">⭐ 0</div>
  <button class="snd" id="snd" aria-label="Звук">🔊</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
// ===== Рисование дорожных знаков (SVG, viewBox 0 0 100 100) =====
const R='#d71920', B='#1d5fbf', Y='#f6c400', K='#1b1b1b', W='#ffffff', G='#13854a', GR='#8a8a8a';
const P=(inner,cx,cy,s)=>`<g transform="translate(${cx-s/2} ${cy-s/2}) scale(${s/100})">${inner}</g>`;
const MIR=s=>`<g transform="translate(100 0) scale(-1 1)">${s}</g>`;
const head=(x,y,a,s,c)=>`<polygon points="0,0 ${-s},${-s*0.72} ${-s},${s*0.72}" fill="${c}" transform="translate(${x} ${y}) rotate(${a})"/>`;
const ln=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const lnb=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="butt" stroke-linejoin="round"/>`;
const T=(t,x,y,s,c,ls)=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" fill="${c}"${ls?` letter-spacing="${ls}"`:''}>${t}</text>`;

// --- формы ---
const TRI=(ic,s=46,cy=64)=>`<path d="M50 6 L95 87 H5 Z" fill="${W}" stroke="${R}" stroke-width="8" stroke-linejoin="round"/>`+P(ic,50,cy,Math.min(s*1.1,54));
const CR=(ic,s=58)=>`<circle cx="50" cy="50" r="44.5" fill="${W}" stroke="${R}" stroke-width="9"/>`+P(ic,50,50,s);
const SLASH=`<line x1="20" y1="20" x2="80" y2="80" stroke="${R}" stroke-width="8"/>`;
const CEND=(ic,s=58)=>`<circle cx="50" cy="50" r="46" fill="${W}" stroke="${K}" stroke-width="1.5"/>`+P(ic,50,50,s)+
  [-24,-12,0,12,24].map(o=>`<line x1="${78+o*0.7}" y1="${22+o*0.7}" x2="${22+o*0.7}" y2="${78+o*0.7}" stroke="${K}" stroke-width="2.6"/>`).join('');
const BC=(ic,s=62)=>`<circle cx="50" cy="50" r="46" fill="${B}"/><circle cx="50" cy="50" r="43.5" fill="none" stroke="${W}" stroke-width="1.6"/>`+P(ic,50,50,s);
const BS=(ic,s=70,col=B)=>`<rect x="4" y="4" width="92" height="92" rx="7" fill="${col}"/><rect x="7.5" y="7.5" width="85" height="85" rx="5" fill="none" stroke="${W}" stroke-width="1.6"/>`+P(ic,50,50,s);
const BWS=(ic,s=52)=>`<rect x="4" y="4" width="92" height="92" rx="7" fill="${B}"/><rect x="16" y="16" width="68" height="68" rx="3" fill="${W}"/>`+P(ic,50,50,s);
const BTRI=(ic,s=40)=>`<rect x="4" y="4" width="92" height="92" rx="7" fill="${B}"/><path d="M50 12 L90 84 H10 Z" fill="${W}"/>`+P(ic,50,62,s);
const SRV=(ic,s=46)=>`<rect x="13" y="2" width="74" height="96" rx="6" fill="${B}"/><rect x="20" y="9" width="60" height="60" rx="2" fill="${W}"/>`+P(ic,50,39,s);
const PLATE=(c)=>`<rect x="3" y="24" width="94" height="52" rx="4" fill="${W}" stroke="${K}" stroke-width="3"/>`+c;
const HRECT=(c,col=B)=>`<rect x="3" y="24" width="94" height="52" rx="5" fill="${col}"/><rect x="6" y="27" width="88" height="46" rx="3" fill="none" stroke="${W}" stroke-width="1.5"/>`+c;

// --- пиктограммы (в квадрате 100х100) ---
const I={
 car:(c,bg)=>`<path d="M6 60 Q6 50 14 48 L22 46 L32 30 Q34 27 38 27 H66 Q70 27 72 30 L80 46 L88 48 Q94 50 94 58 V66 H6 Z" fill="${c}"/><path d="M37 32 H49 V45 H28 Z M53 32 H65 L73 45 H53 Z" fill="${bg}"/><circle cx="26" cy="68" r="11" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="74" cy="68" r="11" fill="${c}" stroke="${bg}" stroke-width="3"/>`,
 carRear:(c,bg)=>`<path d="M27 16 H73 L82 42 H18 Z" fill="${c}"/><rect x="10" y="40" width="80" height="32" rx="7" fill="${c}"/><path d="M32 22 H68 L74 39 H26 Z" fill="${bg}"/><rect x="14" y="70" width="17" height="16" rx="3" fill="${c}"/><rect x="69" y="70" width="17" height="16" rx="3" fill="${c}"/><rect x="15" y="48" width="15" height="8" rx="2" fill="${bg}"/><rect x="70" y="48" width="15" height="8" rx="2" fill="${bg}"/>`,
 truck:(c,bg)=>`<rect x="4" y="20" width="60" height="46" rx="3" fill="${c}"/><path d="M68 32 H84 L96 49 V66 H68 Z" fill="${c}"/><path d="M73 37 H82 L90 49 H73 Z" fill="${bg}"/><circle cx="22" cy="70" r="11" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="82" cy="70" r="11" fill="${c}" stroke="${bg}" stroke-width="3"/>`,
 bus:(c,bg)=>`<rect x="4" y="22" width="92" height="46" rx="8" fill="${c}"/>`+[10,27,44,61].map(x=>`<rect x="${x}" y="29" width="13" height="16" rx="2" fill="${bg}"/>`).join('')+`<rect x="78" y="29" width="12" height="24" rx="2" fill="${bg}"/><circle cx="24" cy="70" r="10" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="72" cy="70" r="10" fill="${c}" stroke="${bg}" stroke-width="3"/>`,
 tram:(c,bg)=>`<path d="M50 24 L36 10 L60 4" fill="none" stroke="${c}" stroke-width="4"/><rect x="8" y="24" width="84" height="50" rx="10" fill="${c}"/>`+[15,34,53,72].map(x=>`<rect x="${x}" y="32" width="13" height="18" rx="2" fill="${bg}"/>`).join('')+`<rect x="16" y="76" width="22" height="9" rx="3" fill="${c}"/><rect x="62" y="76" width="22" height="9" rx="3" fill="${c}"/>`,
 moto:(c)=>`<circle cx="20" cy="66" r="15" fill="none" stroke="${c}" stroke-width="7"/><circle cx="80" cy="66" r="15" fill="none" stroke="${c}" stroke-width="7"/>`+ln('M20 66 L40 50 H62 L80 66',c,7)+`<path d="M34 40 H60 L64 52 H40 Z" fill="${c}"/>`+ln('M64 52 L72 30 H82',c,6),
 bike:(c)=>`<circle cx="22" cy="66" r="17" fill="none" stroke="${c}" stroke-width="6"/><circle cx="78" cy="66" r="17" fill="none" stroke="${c}" stroke-width="6"/>`+ln('M22 66 L46 66 L38 36 Z M38 36 L66 38 L46 66 M66 38 L78 66 M38 36 V29 M31 28 H45 M66 38 L63 25 H74',c,5),
 man:(c)=>`<circle cx="54" cy="11" r="9.5" fill="${c}"/>`+ln('M52 26 L44 54',c,13)+ln('M44 54 L33 78 L24 84',c,9)+ln('M44 54 L60 67 L62 90',c,9)+ln('M50 31 L37 46 L31 57',c,7)+ln('M50 31 L63 43 L73 45',c,7),
 tractor:(c,bg)=>`<rect x="14" y="10" width="34" height="38" rx="3" fill="${c}"/><rect x="20" y="16" width="22" height="16" fill="${bg}"/><rect x="44" y="40" width="46" height="22" rx="3" fill="${c}"/><rect x="72" y="22" width="6" height="20" fill="${c}"/><circle cx="30" cy="66" r="22" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="30" cy="66" r="7" fill="${bg}"/><circle cx="80" cy="76" r="12" fill="${c}" stroke="${bg}" stroke-width="3"/>`,
 loco:(c,bg)=>`<rect x="8" y="38" width="58" height="28" rx="4" fill="${c}"/><rect x="62" y="18" width="32" height="48" fill="${c}"/><rect x="68" y="24" width="20" height="14" fill="${bg}"/><path d="M14 20 H32 L28 40 H18 Z" fill="${c}"/><rect x="4" y="64" width="92" height="7" fill="${c}"/><circle cx="22" cy="78" r="10" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="46" cy="78" r="10" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="78" cy="78" r="10" fill="${c}" stroke="${bg}" stroke-width="3"/>`,
 cow:(c)=>`<rect x="16" y="34" width="58" height="30" rx="12" fill="${c}"/><path d="M70 36 L88 28 L96 32 L94 50 L80 54 Z" fill="${c}"/>`+ln('M86 28 L84 18 M92 30 L96 20',c,4)+`<rect x="20" y="58" width="8" height="28" rx="2" fill="${c}"/><rect x="32" y="58" width="8" height="28" rx="2" fill="${c}"/><rect x="56" y="58" width="8" height="28" rx="2" fill="${c}"/><rect x="66" y="58" width="8" height="28" rx="2" fill="${c}"/>`+ln('M17 40 Q6 50 10 66',c,4),

const KEY='znaki_v1';
let S={pts:0,got:{},sound:true,level:'easy',best:0,met:{}};

const RANKS=[[0,'Пешеход','🚶'],[100,'Юный велосипедист','🚲'],[300,'Штурман','🧭'],[600,'Знаток знаков','🚦'],[1000,'Инспектор дорог','👮'],[1600,'Главный по ПДД','🏆']];

const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

// ===== голос =====
let ruVoice=null;
function loadVoice(){try{const v=speechSynthesis.getVoices();ruVoice=v.find(x=>/ru/i.test(x.lang)&&/female|жен|Milena|Alena|Google/i.test(x.name))||v.find(x=>/ru/i.test(x.lang))||null;}catch(e){}}
try{loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}catch(e){}
function say(t){if(!S.sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
$('snd').onclick=()=>{S.sound=!S.sound;save();hush();renderTop();toast(S.sound?'Голос включён':'Голос выключен')};

// ===== общие элементы =====
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1600)}
function confetti(n=22){const em=['⭐','🎉','🚗','🚦','✨','🏁'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.textContent=em[i%em.length];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}}
function addPts(n){const before=rankOf(S.pts);S.pts+=n;save();renderTop();const after=rankOf(S.pts);if(after>before){setTimeout(()=>{confetti(40);openModal(`<div class="center"><div class="huge">${RANKS[after][2]}</div><h2>Новое звание!</h2><p>Теперь ты — <b>${RANKS[after][1]}</b>. Так держать!</p><button class="btn" onclick="closeModal()">Ура!</button></div>`);say('Новое звание! Теперь ты '+RANKS[after][1])},400)}}

function closeModal(){$('modal').classList.remove('on');hush()}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function setHead(t,sub,back){$('ttl').innerHTML=t+(sub?`<small>${sub}</small>`:'');$('back').classList.toggle('on',!!back)}
$('back').onclick=()=>{hush();go('home')};
function go(v){location.hash=v==='home'?'':v;route()}
function route(){hush();if(window.stopDrive)stopDrive();const h=location.hash.replace('#','');window.scrollTo(0,0);if(h==='drive')DriveMenu();else if(h==='album')Album();else if(h==='bingo')Bingo();else if(h==='quiz')QuizStart();else Home()}

// ===== альбом / охотник =====
let alb={g:0,q:''};
function Album(){
  setHead('Охотник за знаками','нажми на знак, который увидел',true);
  const tabs=[[0,'Все']].concat(Object.keys(GROUPS).map(k=>[+k,GROUPS[k].e+' '+GROUPS[k].k]));
  app.innerHTML=`<input class="search" id="q" placeholder="🔍 Поиск: «дети», «поворот», «3.24»…" value="${esc(alb.q)}">
  <div class="tabs">${tabs.map(([k,t])=>`<button class="tab ${alb.g===k?'on':''}" data-g="${k}">${t}</button>`).join('')}</div><div id="list"></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{alb.g=+b.dataset.g;Album()});
  $('q').oninput=e=>{alb.q=e.target.value;drawList()};
  drawList();
}
function drawList(){
  const q=alb.q.trim().toLowerCase();let h='';
  for(const g of Object.keys(GROUPS).map(Number)){
    if(alb.g&&alb.g!==g)continue;
    const list=SIGNS.filter(s=>s.g===g&&(!q||s.t.toLowerCase().includes(q)||s.n.startsWith(q)||s.d.toLowerCase().includes(q)));
    if(!list.length)continue;
    const all=SIGNS.filter(s=>s.g===g),got=all.filter(s=>S.got[s.n]).length;
    h+=`<div class="ghead"><b>${GROUPS[g].e} ${GROUPS[g].t}</b><span class="muted">${got} / ${all.length}</span></div><div class="grid">`+
     list.map(s=>`<button class="sg ${S.got[s.n]?'got':''}" data-n="${s.n}">${s.rare?'<span class="star">💎</span>':''}${sv(s)}<div class="nm">${s.t}</div></button>`).join('')+'</div>';
  }
  $('list').innerHTML=h||'<p class="muted center">Ничего не нашлось. Попробуй другое слово.</p>';
  $('list').querySelectorAll('.sg').forEach(b=>b.onclick=()=>signCard(b.dataset.n));
}
function signCard(n){
  const s=BY[n],have=S.got[n],pr=s.rare?25:10;
  openModal(`${sv(s,'big')}<div class="center"><span class="num">Знак ${s.n}</span> <span class="muted">${GROUPS[s.g].t}</span></div>
   <h2 class="center">${s.t}</h2><p>${s.d}</p>
   ${have?`<button class="btn sec" disabled>✓ Уже в коллекции</button>`:`<button class="btn" id="found">🚗 Видел в дороге! +${pr} ⭐</button>`}
   <div class="row"><button class="btn sec" id="rd">🔊 Прочитать</button><button class="btn sec" onclick="closeModal()">Закрыть</button></div>
   ${s.rare?'<p class="muted center" style="margin-top:12px">💎 Редкий знак — за него больше звёзд!</p>':''}`);
  $('rd').onclick=()=>say(s.t+'. '+s.d);
  if(!have)$('found').onclick=()=>{S.got[n]=Date.now();save();closeModal();addPts(pr);confetti(s.rare?36:16);toast(`+${pr} ⭐  ${s.t}`);drawList()};
}

// ===== бинго =====
let bingo=null;
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function newBingo(){bingo={c:pick(SIGNS.filter(s=>s.c).map(s=>s.n),9),on:[],won:false};try{sessionStorage.setItem('bingo',JSON.stringify(bingo))}catch(e){}}
function Bingo(){
  setHead('Знаковое бинго','отмечай знаки, которые видишь',true);
  if(!bingo){try{bingo=JSON.parse(sessionStorage.getItem('bingo'))}catch(e){}}
  if(!bingo)newBingo();
  const win=LINES.find(l=>l.every(i=>bingo.on.includes(i)));
  app.innerHTML=`<p class="muted" style="margin:2px 2px 0">Увидел знак из карточки — нажми на него. Три в ряд (по горизонтали, вертикали или диагонали) — победа!</p>
  <div class="bingo">${bingo.c.map((n,i)=>`<button class="bc ${bingo.on.includes(i)?'on':''} ${win&&win.includes(i)?'win':''}" data-i="${i}">${sv(BY[n])}<div class="nm">${BY[n].t}</div></button>`).join('')}</div>
  <button class="btn blue" id="nb" style="margin-top:16px">🔄 Новая карточка</button>`;
  app.querySelectorAll('.bc').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,n=bingo.c[i];
    if(bingo.on.includes(i))bingo.on=bingo.on.filter(x=>x!==i);else{bingo.on.push(i);say(BY[n].t)}
    try{sessionStorage.setItem('bingo',JSON.stringify(bingo))}catch(e){}
    const w=LINES.find(l=>l.every(k=>bingo.on.includes(k)));
    if(w&&!bingo.won){bingo.won=true;try{sessionStorage.setItem('bingo',JSON.stringify(bingo))}catch(e){};Bingo();confetti(50);addPts(50);
      setTimeout(()=>{openModal(`<div class="center"><div class="huge">🎉</div><h2>БИНГО!</h2><p>Ты собрал ряд знаков! +50 ⭐</p><button class="btn" onclick="closeModal();newBingo();Bingo()">Новая карточка</button><button class="btn sec" onclick="closeModal()">Ещё посмотреть</button></div>`);say('Бинго! Ты собрал ряд знаков!')},300);return}
    Bingo();
  });
  $('nb').onclick=()=>{newBingo();Bingo()};
}

// ===== викторина =====
let Q=null;
function QuizStart(){
  setHead('Викторина-штурман','10 вопросов',true);
  app.innerHTML=`<div class="qcard center"><div class="huge">🧭</div><div class="qtext">Готов проверить себя?</div>
  <p class="muted">Вопросы про знаки и правила дороги. Голос прочитает вопрос и варианты ответа.</p>
  <div class="lvl"><button data-l="easy" class="${S.level==='easy'?'on':''}">🙂 Знакомые знаки</button><button data-l="all" class="${S.level==='all'?'on':''}">😎 Все знаки</button></div>
  <button class="btn" id="go">Поехали! ▶</button>${S.best?`<p class="muted">Лучший результат: ${S.best} из 10</p>`:''}</div>`;
  app.querySelectorAll('.lvl button').forEach(b=>b.onclick=()=>{S.level=b.dataset.l;save();QuizStart()});
  $('go').onclick=()=>{buildQuiz();ask()};
}
function buildQuiz(){
  const pool=S.level==='easy'?SIGNS.filter(s=>s.c):SIGNS;
  const sg=pick(pool,7),qs=[];
  sg.forEach((s,i)=>{
    const same=SIGNS.filter(x=>x!==s&&x.g===s.g),other=SIGNS.filter(x=>x!==s&&x.g!==s.g);
    const wrong=pick(same.length>=3?same:same.concat(pick(other,3)),3);
    if(i<4)qs.push({type:'name',s,opts:shuffle([s].concat(wrong))});
    else qs.push({type:'find',s,opts:shuffle([s].concat(wrong))});
  });
  pick(RULES,3).forEach(r=>qs.push({type:'rule',r,opts:shuffle(r.o.map((t,i)=>({t,ok:i===0})))}));
  Q={list:shuffle(qs),i:0,score:0,done:false};
}
function qSpeech(q){
  const nums=['Первый','Второй','Третий','Четвёртый'];
  if(q.type==='name')return 'Что означает этот знак? '+q.opts.map((o,i)=>nums[i]+': '+o.t).join('. ');
  if(q.type==='find')return 'Найди знак: '+q.s.t;
  return q.r.q+' '+q.opts.map((o,i)=>nums[i]+': '+o.t).join('. ');
}
function ask(){
  const q=Q.list[Q.i];Q.done=false;
  setHead('Викторина-штурман',`вопрос ${Q.i+1} из ${Q.list.length}`,true);
  let body='';
  if(q.type==='name')body=`<div class="qtext">Что означает этот знак?</div>${sv(q.s,'qsign')}<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o.t}</button>`).join('')}</div>`;
  else if(q.type==='find')body=`<div class="qtext">Найди знак: «${q.s.t}»</div><div class="opts signs">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${sv(o)}</button>`).join('')}</div>`;
  else body=`<div class="qtext">🚸 ${q.r.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o.t}</button>`).join('')}</div>`;
  app.innerHTML=`<div class="qcard"><div class="qtop"><span>⭐ ${Q.score*10} за игру</span><button class="tab" id="rep">🔊 Повторить</button></div>${body}<div id="ex"></div></div>`;
  $('rep').onclick=()=>say(qSpeech(q));
  setTimeout(()=>say(qSpeech(q)),250);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(Q.done)return;Q.done=true;
  const q=Q.list[Q.i],ok=q.type==='rule'?q.opts[i].ok:q.opts[i]===q.s;
  const right=q.type==='rule'?q.opts.findIndex(o=>o.ok):q.opts.indexOf(q.s);
  const bs=app.querySelectorAll('.opt');bs[right].classList.add('ok');if(!ok)bs[i].classList.add('bad');
  if(ok){Q.score++;addPts(10)}
  const ex=q.type==='rule'?q.r.e:`Знак ${q.s.n} «${q.s.t}». ${q.s.d}`;
  $('ex').innerHTML=`<div class="expl ${ok?'ok':'bad'}"><b>${ok?'✅ Верно! +10 ⭐':'❌ Не совсем.'}</b><br>${ex}</div><button class="btn blue" id="nx">${Q.i+1<Q.list.length?'Дальше ▶':'Итоги 🏁'}</button>`;
  say((ok?'Верно! ':'Не совсем. ')+ex);
  $('nx').onclick=()=>{Q.i++;if(Q.i<Q.list.length)ask();else finish()};
  $('nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function finish(){
  const sc=Q.score;if(sc>(S.best||0)){S.best=sc;save()}
  const msg=sc>=9?'Ты настоящий знаток дорог!':sc>=6?'Отлично! Ещё чуть-чуть — и будет идеально.':sc>=3?'Неплохо! Давай ещё раз — получится лучше.':'Ничего страшного, знаки учатся в дороге. Попробуй ещё!';
  setHead('Викторина-штурман','итоги',true);
  app.innerHTML=`<div class="qcard center"><div class="huge">${sc>=9?'🏆':sc>=6?'🥈':'🚗'}</div><div class="qtext">${sc} из ${Q.list.length}</div><p>${msg}</p>
  <button class="btn" onclick="buildQuiz();ask()">Ещё раз ▶</button><button class="btn sec" onclick="go('home')">На главную</button></div>`;
  if(sc>=8)confetti(40);
  say(sc+' из '+Q.list.length+'. '+msg);
}

  if(pool.length<2)return false;

    const o=shuffle(opts);
    openModal(`<div class="center"><div class="huge">👮</div><h2>Пост ДПС: вопрос</h2><p>Ты недавно проехал знак ограничения скорости. Какая скорость там была разрешена?</p></div>

// ---------- обновление ----------
function obstacleAhead(e,t,self){
  let best=1e9,v=0;
  for(const c of G.npc){if(c===self||c.e!==e)continue;const gap=c.t-34-t;if(gap>-2&&gap<best){best=gap;v=c.v}}
  if(self&&G.e===e){const gap=G.t-34-t;if(gap>-2&&gap<best){best=gap;v=G.v}}
  return {gap:best,v};
}
function pedBlocking(e,t0,t1){
  for(const f of e.feats){if(f.type!=='cross')continue;const p=G.peds[e.k+'@'+f.t];if(p&&p.on&&f.t>t0&&f.t<=t1)return true}
  return false;
}
function railClosed(r){const ph=(G.trainT+r*13)%30;return ph>2&&ph<16}

function update(dt){
  G.time+=dt;G.trainT+=dt;G.cool=Math.max(0,G.cool-dt);
  // пешеходы
  for(const k in G.peds){const p=G.peds[k];if(p.on){p.p+=dt/3.4;if(p.p>=1){p.on=false;p.cd=8}}else p.cd-=dt}
  // NPC
  for(const c of G.npc){
    let target=c.e.type==='ring'?62:40;
    const ob=obstacleAhead(c.e,c.t,c);
    if(ob.gap<60)target=Math.min(target,ob.v);if(ob.gap<14)target=0;
    if(LIGHTS[c.e.i2+','+c.e.j2]&&c.t<BL-STOPL&&c.t>BL-STOPL-70&&lightGreen(c.e.i2,c.e.j2,c.e.d,G.time)!=='g')target=0;
    if(pedBlocking(c.e,c.t,c.t+60))target=0;
    for(const f of c.e.feats)if(f.type==='rail'&&railClosed(f.r)&&f.t-c.t>0&&f.t-c.t<70)target=0;
    c.v+=Math.max(-60*dt,Math.min(25*dt,target-c.v));
    c.t+=c.v/3.6*4*dt;
    if(c.t>=BL){
      const ops=['L','S','R'].filter(tr=>turnTarget(c.e,tr)&&legal(c.e,tr).ok);
      const tr=ops.length?ops[(Math.random()*ops.length)|0]:null;
      c.t-=BL;c.e=tr?turnTarget(c.e,tr):rev(c.e);
    }
  }
  // игрок
  const e=G.e;
  if(G.gas)G.v+=20*dt;else if(G.brake)G.v-=55*dt;else G.v-=3*dt;
  G.v=Math.max(0,Math.min(100,G.v));
  const ops=options(e);
  const need=ops.length>1&&!ops.includes(G.pend);
  const lineT=BL-STOPL;
  if(need&&G.t>lineT-6&&G.t<lineT+4){G.v=0;G.t=Math.min(G.t,lineT-5);if(!G.spoke.need){G.spoke.need=1;sayG('Здесь прямо нельзя — дороги нет. Выбери: налево или направо.',true)}}
  const ob=obstacleAhead(e,G.t,null);
  let nt=G.t+G.v/3.6*4*dt;
  if(ob.gap<1e8&&nt>G.t+ob.gap-2&&G.cool===0){
    if(G.v>ob.v+8){G.cool=3;violation('Ты врезался в машину впереди! Нужно держать дистанцию и вовремя тормозить.',null)}
    nt=G.t+Math.max(0,ob.gap-4);G.v=Math.min(G.v,ob.v);
  }
  const t0=G.t;G.t=nt;
  const front=G.t;
  // знаки: проезд и подсветка
  for(const s of e.signs){
    if(s.t>t0&&s.t<=front){G.recent.push(s);if(!S.met[s.n]){S.met[s.n]=1;save()}}
  }
  // зона
  const z=zoneAt(e,front);G.zone=z;
  if(G.v>z.lim+4){G.overT+=dt;if(G.overT>1.6&&!G.overDone){G.overDone=true;violation(`Превышение скорости: ты ехал ${Math.round(G.v)} км/ч, а здесь можно не больше ${z.lim} км/ч.`,z.src||null)}}else G.overT=0;
  if(z.min&&G.v<z.min-3&&G.v>0.5){G.slowT+=dt;if(G.slowT>5){G.slowT=-20;violation('Слишком медленно! На этом участке нельзя ехать медленнее 30 км/ч — мешаешь другим.',ALL.find(s=>s.n==='4.6'))}}else if(G.slowT>0)G.slowT=0;
  if(G.v<0.5){
    G.stopT+=dt;

    const inZone=front<lineT-90;
    if(inZone&&z.noStop&&G.stopT>2.5&&!G.spoke['ns'+z.noStop.id]){G.spoke['ns'+z.noStop.id]=1;violation('Здесь остановка запрещена — даже ненадолго останавливаться нельзя.',z.noStop)}
    if(inZone&&z.noPark&&G.stopT>7&&!G.spoke['np'+z.noPark.id]){G.spoke['np'+z.noPark.id]=1;violation('Здесь стоянка запрещена — машину тут оставлять нельзя. Высадить пассажира можно, а стоять долго — нет.',z.noPark)}
  }else G.stopT=0;
  // пешеходы, неровности, переезды
  for(const f of e.feats){
    if(f.type==='cross'){
      const k=e.k+'@'+f.t,rk=rev(e).k+'@'+(BL-f.t);let p=G.peds[k]||G.peds[rk];
      if(!p){p=G.peds[k]={on:false,p:0,cd:0,side:1};G.peds[rk]=p}
      if(!p.on&&p.cd<=0&&front<f.t-110&&front>f.t-190&&Math.random()<dt*0.9){p.on=true;p.p=0;p.side=Math.random()<.5?1:-1;sayG('Внимание: пешеход!')}
      if(t0<f.t&&front>=f.t&&p.on&&p.p>0.04&&p.p<0.96)violation('Ты не пропустил пешехода на пешеходном переходе! Перед «зеброй» нужно остановиться и пропустить людей.',e.signs.find(s=>s.n==='5.19.1'&&Math.abs(s.t-f.t)<30));
    }
    if(f.type==='bump'&&t0<f.t&&front>=f.t&&G.v>22){G.v*=0.4;violation('Бум! Машину сильно тряхнуло на «лежачем полицейском». Перед неровностью надо сбросить скорость до 20 км/ч.',e.signs.find(s=>s.n==='5.20'))}
    if(f.type==='rail'&&t0<f.t&&front>=f.t&&railClosed(f.r))violation('Ты выехал на железнодорожный переезд, когда горел красный сигнал! Это очень опасно — поезд не может быстро остановиться.',e.signs.find(s=>s.n==='1.3.1'));
  }
  // стоп-линия
  if(!G.lineDone&&t0<lineT&&front>=lineT){
    G.lineDone=true;
    const nid=e.i2+','+e.j2;
    if(LIGHTS[nid]&&lightGreen(e.i2,e.j2,e.d,G.time)==='r')violation('Проезд на красный сигнал светофора! На красный ехать нельзя — нужно остановиться перед стоп-линией.',null);
    const stopS=e.signs.find(s=>s.n==='2.5');
    if(stopS&&!G.stopFlag)violation('Знак «STOP»: перед перекрёстком нужно полностью остановиться, даже если никого нет.',stopS);
    const yS=e.signs.find(s=>s.n==='2.4');
    if(yS&&!stopS&&G.v>25&&!LIGHTS[nid])violation('Знак «Уступите дорогу»: ты въехал на перекрёсток слишком быстро. Надо притормозить и пропустить машины на главной дороге.',yS);
  }
  // перекрёсток
  if(G.t>=BL){
    let tr=ops.length===1?ops[0]:G.pend;
    if(!ops.includes(tr))tr=ops[0];
    const lg=legal(e,tr),e2=turnTarget(e,tr);
    G.nodes++;
    if(ops.length>1){
      if(!lg.ok){
        const what=lg.why==='entry'?'Ты въехал туда, где висит «кирпич» — въезд запрещён! Это улица с односторонним движением, навстречу ехать нельзя.':lg.why==='closed'?'Ты заехал на дорогу, где движение машин запрещено!':`Ты поехал ${TURN_NM[tr]}, а знак это запрещает!`;
        violation((G.cmdTrap&&G.cmd===tr?'Инструктор тебя проверял. ':'')+what,lg.sign);
      }else if(G.cmd){
        if(G.cmdTrap){G.goodTraps++;good('Молодец! Инструктор хитрил, а ты заметил знак',25);say('Молодец! Ты заметил знак и поехал по правилам.')}
        else if(tr===G.cmd){G.legalTurns++;good('Точно по команде',5)}
        else toast('Инструктор просил '+TURN_NM[G.cmd]+' — но так ехать тоже можно');
      }
    }
    G.t-=BL;G.e=e2;G.pend='S';G.lineDone=false;G.stopFlag=false;G.overDone=false;G.spoke.need=0;
    planCmd();
    // миссия
    const every=G.mode==='teach'?3:4;
    if(G.nodes%every===0)whenFree(()=>{if(G&&!G.over)askInspector()});
  }
  // команда инструктора
  if(G.cmd&&!G.cmdSaid&&G.t>40){G.cmdSaid=true;sayG('На перекрёстке — '+TURN_NM[G.cmd]+'.',true)}
  // подсказки по знакам
  if(G.hints){
    const near=G.e.signs.find(s=>s.t>G.t-2&&s.t-G.t<230&&!G.spoke[s.id]&&BY[s.n].g!==8);
    if(near&&G.time-G.lastSay>2.5&&!speechSynthesis.speaking){G.spoke[near.id]=1;sayG(instName(near))}
  }
  // задание
  if(G.mode==='free'&&G.mission&&G.v<0.5&&G.e===G.mission.e&&Math.abs(G.mission.t-G.t)<95&&!G.mDone){
    G.mDone=true;good('Задание выполнено! Ты нашёл «'+instName(G.mission)+'»',30);confetti(24);
    setTimeout(()=>{G.mDone=false;newMission()},1800);
  }
}

let cv,cx,mm,mx,raf=0,last=0,dpr=1;

function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;

  const z=Math.min(w,560)/380;

  const th=Math.atan2(G.e.dy,G.e.dx);let dh=th-G.vh;while(dh>Math.PI)dh-=2*Math.PI;while(dh<-Math.PI)dh+=2*Math.PI;G.vh+=dh*0.12;

  // зебры, неровности, велодорожка, мост, тоннель
  for(const c of WORLD.cross){cx.fillStyle='#fff';for(let k=-RW/2+4;k<RW/2;k+=12){if(c.h)cx.fillRect(c.x-14,c.y+k,28,7);else cx.fillRect(c.x+k,c.y-14,7,28)}}
  for(const b of WORLD.bump){for(let k=-RW/2;k<RW/2;k+=10){cx.fillStyle=((k/10)|0)%2?'#f6c400':'#222';if(b.h)cx.fillRect(b.x-7,b.y+k,14,10);else cx.fillRect(b.x+k,b.y-7,10,14)}}
  for(const b of WORLD.bike){cx.fillStyle='rgba(46,160,67,.85)';cx.fillRect(b.x0,b.y-12,b.x1-b.x0,24)}
  for(const r of WORLD.rail){cx.fillStyle='#fff';cx.fillRect(r.x-RW,r.cy-RW/2-30,RW*2,4);}
  for(const n of WORLD.narrow){cx.fillStyle='#e0e0e0';cx.fillRect(n.x-RW/2-6,n.y0,14,n.y1-n.y0);cx.fillStyle='#d71920';for(let y=n.y0;y<n.y1;y+=30)cx.fillRect(n.x-RW/2-6,y,14,14)}
  if(WORLD.river){cx.fillStyle='#8d6e63';cx.fillRect(-RW/2-10,WORLD.river.y-34,8,68);cx.fillRect(RW/2+2,WORLD.river.y-34,8,68)}
  // пешеходы
  for(const e of Object.values(E))for(const f of e.feats){if(f.type!=='cross')continue;const p=G.peds[e.k+'@'+f.t];if(!p||!p.on)continue;
    const along=f.t,lat=(p.p-0.5)*(RW+30)*p.side;const q={x:e.ax+e.dx*along+e.nx*lat,y:e.ay+e.dy*along+e.ny*lat};
    cx.fillStyle='#ff9800';cx.beginPath();cx.arc(q.x,q.y,8,0,7);cx.fill();cx.fillStyle='#5d4037';cx.beginPath();cx.arc(q.x,q.y,4.5,0,7);cx.fill()}
  // поезд
  for(const [ri,r] of WORLD.rail.entries()){const ph=(G.trainT+ri*13)%30;if(ph<3||ph>15)continue;const k=(ph-3)/12;
    const len=260,yy=ri===0?r.y0+(r.y1-r.y0+len)*k-len:r.y1-(r.y1-r.y0+len)*k;
    cx.fillStyle='#c62828';cx.fillRect(r.x-14,yy,28,len);cx.fillStyle='#ffcdd2';for(let y=yy+10;y<yy+len-10;y+=30)cx.fillRect(r.x-9,y,18,14)}
  // машины
  for(const c of G.npc){const p=pos(c.e,c.t-17);if(!vis(p.x,p.y))continue;car(p.x,p.y,Math.atan2(c.e.dy,c.e.dx),c.c)}
  car(G.vx-Math.cos(G.vh)*17,G.vy-Math.sin(G.vh)*17,G.vh,'#ffcc00',true);
  // тоннель
  for(const t of WORLD.tunnel){cx.fillStyle='rgba(40,40,40,.82)';cx.fillRect(t.x0,t.y-RW/2-14,t.x1-t.x0,RW+28)}
  // самолёт
  const pl=(G.time%22)/22;if(pl<0.5){const py=3.2*BL+pl*2*1.6*BL;plane(5*BL+230-pl*2*500,py)}
  // ---- знаки и светофоры (без поворота) ----
  cx.setTransform(dpr,0,0,dpr,0,0);
  const nextNode=[G.e.i2,G.e.j2];
  const hi=[];
  for(const e of Object.values(E)){
    const mx2=e.ax+e.dx*BL/2,my2=e.ay+e.dy*BL/2;if(Math.abs(mx2-G.vx)>R||Math.abs(my2-G.vy)>R)continue;
    const mine=e===G.e;
    const atNext=e.i===nextNode[0]&&e.j===nextNode[1];
    let grp={};
    for(const s of e.signs){(grp[s.t]=grp[s.t]||[]).push(s)}
    for(const t in grp){
      const list=grp[t],p=pos(e,+t,SOFF);const [sx,sy]=w2s(p.x,p.y);
      if(sx<-60||sy<-60||sx>w+60||sy>h+60)continue;
      const facing=mine||(atNext&&+t<70);
      if(!facing){cx.fillStyle='#7b8794';cx.beginPath();cx.arc(sx,sy-6,6,0,7);cx.fill();continue}
      const ahead=mine?(+t>G.t-4&&+t-G.t<240):true;
      const big=G.hints&&ahead;
      const size=big?42:30;
      cx.fillStyle='#555';cx.fillRect(sx-1.5,sy-4,3,8);
      list.forEach((s,k)=>{const y=sy-6-size*(k+1)-k*2;
        if(big){cx.save();cx.shadowColor='#ffeb3b';cx.shadowBlur=16+6*Math.sin(G.time*6);cx.fillStyle='rgba(255,235,59,.55)';cx.beginPath();cx.arc(sx,y+size/2,size/2+5,0,7);cx.fill();cx.restore()}
        const im=imgOf(s);if(im.complete)cx.drawImage(im,sx-size/2,y,size,size);
        if(mine&&ahead)hi.push({s,d:+t-G.t});
      });
    }
  }
  for(const k in LIGHTS){const [i,j]=k.split(',').map(Number);for(let d=0;d<4;d++){const e=E[ek(i-DX[d],j-DY[d],d)];if(!e)continue;
    const p=pos(e,BL-STOPL+6,RW/2+20);const [sx,sy]=w2s(p.x,p.y);if(sx<-40||sy<-40||sx>w+40||sy>h+40)continue;
    const st=lightGreen(i,j,d,G.time),mine=e===G.e;const r=mine?9:5;
    cx.fillStyle='#222';cx.fillRect(sx-r-3,sy-r*6-6,r*2+6,r*6+6);
    ['r','y','g'].forEach((c,n)=>{cx.fillStyle=st===c?{r:'#ff3b30',y:'#ffcc00',g:'#2ecc40'}[c]:'#444';cx.beginPath();cx.arc(sx,sy-r*5-3+n*r*2,r*0.8,0,7);cx.fill()})}}
  for(const [ri,r] of WORLD.rail.entries()){if(!railClosed(ri))continue;const [sx,sy]=w2s(r.x+RW,r.cy+RW/2+24);if(Math.sin(G.time*10)>0){cx.fillStyle='#ff1744';cx.beginPath();cx.arc(sx,sy,8,0,7);cx.fill()}
    if(r.barrier){const [ax,ay]=w2s(r.x-60,r.cy-RW/2-30),[bx,by]=w2s(r.x-60,r.cy+RW/2+30);cx.strokeStyle='#d71920';cx.lineWidth=5;cx.setLineDash([10,8]);cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();cx.setLineDash([]);
      const [cx2,cy2]=w2s(r.x+60,r.cy-RW/2-30),[dx2,dy2]=w2s(r.x+60,r.cy+RW/2+30);cx.beginPath();cx.setLineDash([10,8]);cx.moveTo(cx2,cy2);cx.lineTo(dx2,dy2);cx.stroke();cx.setLineDash([])}}
  hud(hi);
  minimap();
}
function trees(x0,y0,s,sd,n=8){for(let k=0;k<n;k++){sd=(sd*53+19)%97;const x=x0+((sd*7)%97)/97*s,y=y0+((sd*13)%89)/89*s;cx.fillStyle='#2e7d32';cx.beginPath();cx.arc(x,y,16+(sd%8),0,7);cx.fill();cx.fillStyle='#43a047';cx.beginPath();cx.arc(x-4,y-4,9,0,7);cx.fill()}}
function cow(x,y){cx.fillStyle='#fff';cx.fillRect(x-14,y-8,28,16);cx.fillStyle='#333';cx.fillRect(x-6,y-8,8,8);cx.fillRect(x+14,y-5,8,10)}
function plane(x,y){cx.save();cx.translate(x,y);cx.rotate(Math.PI);cx.fillStyle='rgba(0,0,0,.2)';cx.fillRect(-30,40,60,8);cx.fillStyle='#eceff1';cx.fillRect(-8,-40,16,80);cx.fillRect(-45,-6,90,14);cx.fillRect(-18,30,36,8);cx.restore()}
function car(x,y,a,c,me){cx.save();cx.translate(x,y);cx.rotate(a);cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(-15,-8,36,20);cx.fillStyle=c;cx.beginPath();cx.roundRect?cx.roundRect(-17,-10,34,20,5):cx.rect(-17,-10,34,20);cx.fill();
  cx.fillStyle='rgba(30,40,60,.75)';cx.fillRect(2,-8,8,16);cx.fillRect(-12,-8,6,16);
  if(me){cx.fillStyle='#fff8c4';cx.fillRect(15,-9,3,5);cx.fillRect(15,4,3,5);if(G.brake||G.v<0.5){cx.fillStyle='#ff3b30';cx.fillRect(-18,-9,3,5);cx.fillRect(-18,4,3,5)}
    if(G.pend!=='S'&&Math.sin(G.time*10)>0){cx.fillStyle='#ff9800';const yy=G.pend==='L'?-10:7;cx.fillRect(12,yy,6,3);cx.fillRect(-18,yy,6,3)}}
  cx.restore()}
function hud(hi){
  document.getElementById('dspd').innerHTML=`${Math.round(G.v)}<small>км/ч</small>`;
  const lb=document.getElementById('dlim');
  if(G.hints&&G.zone){lb.classList.remove('hide');lb.textContent=G.zone.lim;lb.classList.toggle('warn',G.v>G.zone.lim+2)}else lb.classList.add('hide');
  document.getElementById('dheart').textContent='❤️'.repeat(Math.max(0,G.hearts))+'🤍'.repeat(5-Math.max(0,G.hearts));
  document.getElementById('dpts').textContent='⭐ '+G.pts;
  const ib=document.getElementById('dinst');const ikey=G.mode+(G.cmd||'')+(G.mission?G.mission.id:'');
  if(ib.dataset.k===ikey){}else if(G.mode==='teach'){ib.dataset.k=ikey;
    ib.innerHTML=G.cmd?`<span class="ar">${TURN_AR[G.cmd]}</span><span>Инструктор: <b>на перекрёстке ${TURN_NM[G.cmd]}</b><br><small>Помни: если знак запрещает — едь по правилам!</small></span>`:'<span class="ar">🙂</span><span>Инструктор: <b>едем дальше</b></span>';
  }else if(G.mission){ib.dataset.k=ikey;
    ib.innerHTML=`${instSvg(G.mission,'mi')}<span>Задание: найди <b>«${instName(G.mission)}»</b><br><small>и остановись рядом</small></span>`;
  }
  const sc=document.getElementById('dsign');
  hi.sort((a,b)=>a.d-b.d);const f=hi.find(x=>BY[x.s.n].g!==8)||hi[0];
  if(G.hints&&f){sc.classList.remove('hide');if(sc.dataset.id!==f.s.id){sc.dataset.id=f.s.id;sc.innerHTML=`${instSvg(f.s)}<div><b>${instName(f.s)}</b><span id="dsd"></span></div>`}
    const dd=document.getElementById('dsd');if(dd)dd.textContent=f.d>8?`через ${Math.round(f.d/4)} м`:'здесь'}
  else{sc.classList.add('hide');sc.dataset.id=''}
  const ops=options(G.e);
  document.querySelectorAll('.tb').forEach(b=>{const t=b.dataset.t;b.classList.toggle('on',G.pend===t);b.classList.toggle('na',!ops.includes(t))});
  const warn=document.getElementById('dwarn');
  if(ops.length>1&&!ops.includes(G.pend)&&G.t>BL-200){warn.classList.remove('hide');warn.textContent='Прямо дороги нет — выбери ⬅ или ➡'}
  else if(ops.length===1&&G.t>BL-230){warn.classList.remove('hide');warn.textContent='Впереди поворот '+TURN_NM[ops[0]]+' — сбавь скорость'}
  else warn.classList.add('hide');
}
function minimap(){
  const s=mm.width,k=s/(BL*(N-1)+200),o=100*k;
  mx.clearRect(0,0,s,s);mx.fillStyle='rgba(20,30,50,.75)';mx.fillRect(0,0,s,s);
  for(const e of Object.values(E)){if(e.d>1)continue;mx.strokeStyle=e.closed?'#c8b48a':(e.noEntry||rev(e).noEntry)?'#90caf9':'#cfd8dc';mx.lineWidth=e.closed?1:2;mx.beginPath();mx.moveTo(o+e.ax*k,o+e.ay*k);mx.lineTo(o+e.i2*BL*k,o+e.j2*BL*k);mx.stroke()}
  if(G.mission&&G.hints&&Math.sin(G.time*6)>-0.3){const p=pos(G.mission.e,G.mission.t,SOFF);mx.fillStyle='#ffeb3b';mx.beginPath();mx.arc(o+p.x*k,o+p.y*k,4,0,7);mx.fill()}
  mx.save();mx.translate(o+G.vx*k,o+G.vy*k);mx.rotate(G.vh);mx.fillStyle='#ffcc00';mx.beginPath();mx.moveTo(6,0);mx.lineTo(-4,-4);mx.lineTo(-4,4);mx.fill();mx.restore();
}
function loop(ts){
  if(!G||!document.getElementById('dcv')){raf=0;return}
  const dt=Math.min(0.05,(ts-(last||ts))/1000);last=ts;
  const paused=document.getElementById('modal').classList.contains('on')||document.hidden||G.over;
  if(!paused)update(dt);
  draw();
  raf=requestAnimationFrame(loop);
}

// ---------- экраны ----------
window.DriveMenu=function(){
  setHead('За рулём по городу','знаки, инструктор и инспектор',true);
  stopDrive();
  const met=PLACED.filter(n=>S.met[n]).length;
  app.innerHTML=`<div class="qcard center"><div class="huge">🚗🏙️</div><div class="qtext">Город, где стоят все знаки</div>
   <p class="muted">Едешь по улицам и загородной трассе. Знаки стоят по-настоящему: одни прямо у перекрёстка, другие заранее — проехал и не заметил, а потом это важно!</p>
   <div class="bar"><i style="width:${Math.round(met/PLACED.length*100)}%"></i></div><p class="muted">Встречено знаков: <b>${met} из ${PLACED.length}</b></p></div>
  <div class="modes">
   <button class="mode" onclick="DriveStart('teach',${S.dhints!==false})"><div class="ic" style="font-size:46px;display:grid;place-items:center">👨‍🏫</div><div><b>С инструктором</b><span>Инструктор говорит, куда ехать. Иногда он хитрит — а знак запрещает! Смотри на знаки.</span></div></button>
   <button class="mode" onclick="DriveStart('free',${S.dhints!==false})"><div class="ic" style="font-size:46px;display:grid;place-items:center">🗺️</div><div><b>Свободная езда</b><span>Катайся по городу где хочешь. Задания: найти заправку, кафе, парковку…</span></div></button>
  </div>
  <div class="lvl" style="margin-top:14px"><button id="h1" class="${S.dhints!==false?'on':''}">💡 Знаки подсвечиваются</button><button id="h0" class="${S.dhints===false?'on':''}">🕶️ Без подсказок</button></div>
  <div class="note">Управление: <b>Газ</b> и <b>Тормоз</b> — держи пальцем. Стрелки ⬅ ⬆ ➡ — куда повернуть на ближайшем перекрёстке (мигает поворотник). На компьютере — клавиши со стрелками и пробел.<br><br>👮 Пять нарушений — и инспектор остановит поездку. Иногда на посту ДПС спросят, какой знак ты недавно проехал.</div>`;
  document.getElementById('h1').onclick=()=>{S.dhints=true;save();DriveMenu()};
  document.getElementById('h0').onclick=()=>{S.dhints=false;save();DriveMenu()};
};
window.DriveStart=function(mode,hints){
  stopDrive();
  if(location.hash!=='#drive'){history.replaceState(null,'','#drive')}
  setHead(mode==='teach'?'С инструктором':'Свободная езда',hints?'знаки подсвечиваются':'без подсказок',true);
  newGame(mode,hints);
  const d=document.createElement('div');d.id='drive';
  d.innerHTML=`<canvas id="dcv"></canvas><div id="dflash"></div>
   <div class="dtop"><div class="dleft"><div id="dspd" class="dspd">0</div><div id="dlim" class="dlim hide">60</div></div>
    <div id="dinst" class="dinst"></div>
    <div class="dright"><div id="dheart" class="dheart"></div><div id="dpts" class="dpts"></div><canvas id="dmm" width="180" height="180"></canvas></div></div>
   <div id="dsign" class="dsign hide"></div><div id="dwarn" class="dwarn hide"></div>
   <div class="dctl"><div class="turns"><button class="tb" data-t="L">⬅</button><button class="tb" data-t="S">⬆</button><button class="tb" data-t="R">➡</button></div>
    <div class="peds"><button class="pb br" id="dbr">Тормоз</button><button class="pb gs" id="dgs">Газ</button></div></div>`;
  document.body.appendChild(d);d.style.top=document.querySelector('header').offsetHeight+'px';
  cv=document.getElementById('dcv');cx=cv.getContext('2d');mm=document.getElementById('dmm');mx=mm.getContext('2d');dpr=Math.min(2,window.devicePixelRatio||1);
  d.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{G.pend=b.dataset.t;G.spoke.need=0});
  const hold=(el,k)=>{const on=e=>{e.preventDefault();G[k]=true;el.classList.add('dn')},off=e=>{G[k]=false;el.classList.remove('dn')};
    el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);el.addEventListener('contextmenu',e=>e.preventDefault())};
  hold(document.getElementById('dgs'),'gas');hold(document.getElementById('dbr'),'brake');
  last=0;raf=requestAnimationFrame(loop);
  // все картинки знаков заранее
  ALL.forEach(imgOf);
  setTimeout(()=>{if(!G)return;
    openModal(`<div class="center"><div class="huge">${mode==='teach'?'👨‍🏫':'🗺️'}</div><h2>${mode==='teach'?'Поехали с инструктором!':'Свободная езда'}</h2></div>
     <p>${mode==='teach'?'Инструктор будет говорить, куда повернуть. Но он может и <b>схитрить</b> — если знак запрещает, поезжай туда, где можно. За это — бонус!':'Катайся где хочешь и выполняй задания. Найди нужный знак и остановись рядом.'}</p>
     <p>Следи за скоростью: знак ограничения действует <b>до ближайшего перекрёстка</b>. В городе — не больше 60, за городом — не больше 90 км/ч.</p>
     <button class="btn" onclick="closeModal()">Завести мотор 🔑</button>`);
    say(mode==='teach'?'Поехали! Слушай инструктора, но смотри на знаки.':'Свободная езда. Катайся и выполняй задания.');
  },50);
};
function stopDrive(){const d=document.getElementById('drive');if(d)d.remove();if(raf)cancelAnimationFrame(raf);raf=0;G=null}
window.stopDrive=stopDrive;
document.addEventListener('keydown',e=>{if(!G||document.getElementById('modal').classList.contains('on'))return;
  if(e.key==='ArrowUp'){G.gas=true;e.preventDefault()}else if(e.key==='ArrowDown'||e.key===' '){G.brake=true;e.preventDefault()}
  else if(e.key==='ArrowLeft'){G.pend=G.pend==='L'?'S':'L';e.preventDefault()}else if(e.key==='ArrowRight'){G.pend=G.pend==='R'?'S':'R';e.preventDefault()}});
document.addEventListener('keyup',e=>{if(!G)return;if(e.key==='ArrowUp')G.gas=false;if(e.key==='ArrowDown'||e.key===' ')G.brake=false});
window.__DRIVE={E,ALL,PLACED,legal,options,turnTarget,zoneAt,get G(){return G}};
})();

</script>
